name: Staging quality gate

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify resource isolation
        run: |
          node -e "const c=JSON.parse(require('fs').readFileSync('./wrangler.jsonc','utf8')); if(c.name!=='wordloop-staging'||c.workers_dev!==true||c.preview_urls!==false||c.d1_databases?.[0]?.database_name!=='wordloop-push-staging'||c.d1_databases?.[0]?.database_id==='87f5d0d3-10ae-437e-b2c4-6e8dd9820b1c')process.exit(1)"
      - run: npm ci
      - name: Audit deployed dependencies for high/critical advisories
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -- --mode staging
      - name: Install browsers for UI regression tests
        run: npx playwright install --with-deps chromium webkit
      - name: UI regression tests (Chromium + WebKit, iPhone viewport, local server only)
        run: npm run test:e2e
      - name: Smoke test local Staging Worker and HTML
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --mode staging --host 127.0.0.1 --port 4173 > /tmp/wordloop-staging-dev.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/api/health -o /tmp/wordloop-health.json; then break; fi
            if [[ "$i" == 40 ]]; then cat /tmp/wordloop-staging-dev.log; exit 1; fi
            sleep 2
          done
          node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/wordloop-health.json','utf8'));if(j.service!=='wordloop'||j.storage!=='device-only')process.exit(1)"
          curl --fail --silent http://127.0.0.1:4173/ -o /tmp/wordloop-index.html
          grep -q 'id="root"' /tmp/wordloop-index.html
          curl --fail --silent http://127.0.0.1:4173/manifest.webmanifest -o /tmp/wordloop-manifest.json
          echo "Staging API, index and PWA manifest served successfully."

      - name: Verify unauthenticated visitors cannot access UAT
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://wordloop-staging.nf24-wordloop.workers.dev"
          for endpoint in "/" "/api/health" "/sw.js"; do
            status=$(curl -sS --max-time 20 -D /tmp/staging-headers -o /tmp/staging-body -w '%{http_code}' "$BASE$endpoint")
            echo "$endpoint -> HTTP $status"
            if [[ "$status" == "302" || "$status" == "303" || "$status" == "307" ]]; then
              if ! grep -Eqi 'location: .*cloudflareaccess.com|location: .*/cdn-cgi/access/' /tmp/staging-headers; then
                echo "Unexpected redirect: Access protection not verified"; exit 1
              fi
            elif [[ "$status" == "401" || "$status" == "403" ]]; then
              if ! grep -Eqi 'cloudflare|access' /tmp/staging-headers /tmp/staging-body; then
                echo "Denied response not verifiably from Access"; exit 1
              fi
            else
              echo "UAT is not behind an expected Access login/denial"; exit 1
            fi
          done
