name: Staging quality gate

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # e2e (Chromium + WebKit) alone takes ~11 min; 12 cancelled green runs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify resource isolation
        run: |
          node -e "const c=JSON.parse(require('fs').readFileSync('./wrangler.jsonc','utf8')); if(c.name!=='wordloop-staging'||c.workers_dev!==true||c.preview_urls!==false||c.d1_databases?.[0]?.database_name!=='wordloop-push-staging'||c.d1_databases?.[0]?.database_id==='87f5d0d3-10ae-437e-b2c4-6e8dd9820b1c')process.exit(1)"
      - run: npm ci
      # Runtime dependencies only. `--omit=optional` skips the packages the lockfile marks optional/devOptional in the
      # production tree: `vite` (an OPTIONAL peer of @codefusion-cc/web-push, for its build plugin) with its subtree and
      # native build binaries. None of them is bundled into the Worker or the app. Still audited: web-push,
      # workers-crypto, srs-kit, lucide-react, react, react-dom, scheduler, ts-fsrs.
      # Owner-approved 2026-11-17 for GHSA-fc5q-39xc-vjpf (picomatch <= 4.0.7, no patched release).
      # Revert to `npm audit --omit=dev --audit-level=high` once picomatch ships a fix.
      - name: Audit deployed dependencies for high/critical advisories
        run: npm audit --omit=dev --omit=optional --audit-level=high
      - name: Full audit incl. build tools (informational, does not block)
        continue-on-error: true
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -- --mode staging
      - name: Install browsers for UI regression tests
        run: npx playwright install --with-deps chromium webkit
      - name: UI regression tests (Chromium + WebKit, iPhone viewport, local server only)
        run: npm run test:e2e
      - name: Smoke test local Staging Worker and HTML
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --mode staging --host 127.0.0.1 --port 4173 > /tmp/wordloop-staging-dev.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/api/health -o /tmp/wordloop-health.json; then break; fi
            if [[ "$i" == 40 ]]; then cat /tmp/wordloop-staging-dev.log; exit 1; fi
            sleep 2
          done
          node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/wordloop-health.json','utf8'));if(j.service!=='wordloop'||j.storage!=='device-only')process.exit(1)"
          curl --fail --silent http://127.0.0.1:4173/ -o /tmp/wordloop-index.html
          grep -q 'id="root"' /tmp/wordloop-index.html
          curl --fail --silent http://127.0.0.1:4173/manifest.webmanifest -o /tmp/wordloop-manifest.json
          echo "Staging API, index and PWA manifest served successfully."

      - name: Verify unauthenticated visitors cannot access UAT
        shell: bash
        # #70: Staging is protected either by Cloudflare Access or by the Worker's personal-PIN gate (AUTH_MODE=pin).
        # Either is accepted; an OPEN app page, service worker or API fails the gate. /api/health is public in PIN mode
        # (no data), so it is not used as evidence here.
        run: |
          set -euo pipefail
          BASE="https://wordloop-staging.nf24-wordloop.workers.dev"
          check() {
            local endpoint="$1" accept="$2" status
            status=$(curl -sS --max-time 20 -H "Accept: $accept" -D /tmp/staging-headers -o /tmp/staging-body -w '%{http_code}' "$BASE$endpoint")
            echo "$endpoint ($accept) -> HTTP $status"
            if [[ "$status" == "302" || "$status" == "303" || "$status" == "307" ]]; then
              if grep -Eqi 'location: .*cloudflareaccess.com|location: .*/cdn-cgi/access/' /tmp/staging-headers; then echo "  Cloudflare Access"; return 0; fi
              if grep -Eqi '^location: (/login|https://wordloop-staging.nf24-wordloop.workers.dev/login)' /tmp/staging-headers; then echo "  PIN gate"; return 0; fi
              echo "Unexpected redirect: protection not verified"; exit 1
            elif [[ "$status" == "401" || "$status" == "403" ]]; then
              if grep -Eqi '"code":"auth"|Sign-in required' /tmp/staging-body; then echo "  PIN gate"; return 0; fi
              if grep -Eqi 'cloudflare|access' /tmp/staging-headers /tmp/staging-body; then echo "  Cloudflare Access"; return 0; fi
              echo "Denied response not verifiably from Access or the PIN gate"; exit 1
            fi
            echo "UAT is not behind Access or the PIN gate"; exit 1
          }
          check "/" "text/html"
          check "/" "*/*"
          check "/sw.js" "*/*"
          check "/api/push/key" "application/json"
          check "/api/practice/story/status" "application/json"
