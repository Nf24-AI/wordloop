<svg xmlns="http://www.w3.org/2000/svg" width="440" height="880" viewBox="0 0 440 880"><rect width="440" height="880" fill="#F7F6F3"/><text x="25" y="37" font-family="Arial" font-size="13" fill="#777">‹ Back</text><text x="370" y="37" font-family="Arial" font-size="13" fill="#777">Aa  ⋯</text><text x="28" y="114" font-family="Georgia,serif" font-size="26" font-weight="bold" fill="#222">The Lit Windows of Strangers</text><g font-family="Georgia,serif" font-size="23" fill="#242424"><text x="28" y="181">On my way home late at night, I</text><text x="28" y="218">notice the lit windows of strangers.</text><text x="28" y="255">Each window holds a little story.</text><rect x="27" y="314" width="105" height="32" rx="4" fill="#F9E39B"/><text x="30" y="338" font-weight="bold">Although</text><text x="140" y="338">I don't know them, I feel</text><text x="28" y="375">connected to their quiet moments.</text><text x="28" y="445">A person on the bus might be</text><text x="28" y="482">celebrating, worrying, or dreaming.</text><rect x="27" y="538" width="160" height="32" rx="4" fill="#B8DEC4"/><text x="30" y="562" font-weight="bold">Consequently,</text><text x="195" y="562">I try to be</text><text x="28" y="599">a little gentler with strangers.</text><text x="28" y="675">Somewhere, someone is looking out,</text><text x="28" y="712">wondering about you too.</text></g><rect x="28" y="777" width="14" height="14" rx="3" fill="#F9E39B"/><text x="50" y="789" font-family="Arial" font-size="13" fill="#666">Saved vocabulary</text><rect x="212" y="777" width="14" height="14" rx="3" fill="#B8DEC4"/><text x="234" y="789" font-family="Arial" font-size="13" fill="#666">Suggested phrases</text><rect x="28" y="815" width="384" height="44" rx="12" fill="#292929"/><text x="220" y="843" text-anchor="middle" font-family="Arial" font-size="15" fill="#fff">Finish Reading</text></svg>